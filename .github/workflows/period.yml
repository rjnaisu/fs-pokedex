name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed service health
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fs-pokedex-hidden-willow-8527.fly.dev/health
          follow-redirect: false 
          max-attempts: 3
          retry-delay: 5s
          retry-all: false
          